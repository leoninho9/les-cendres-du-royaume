<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090d17"><title>Les Cendres du Royaume</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b14;color:#f6eee1;font-family:Georgia,serif}body{min-height:100dvh;overflow-x:hidden}.world{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 48%,#a7482b88 0%,#4c233c55 24%,transparent 60%),linear-gradient(180deg,#121b31,#1a1826 52%,#070910 100%)}.world:before{content:"";position:absolute;inset:7% 0 0;background:linear-gradient(135deg,transparent 40%,#090b13 41% 44%,transparent 45%) 0 30%/45% 70% no-repeat,linear-gradient(225deg,transparent 39%,#090b13 40% 44%,transparent 45%) 100% 30%/45% 70% no-repeat,linear-gradient(0deg,#080b14 0%,transparent 80%)}.tower{position:absolute;left:50%;top:17%;width:15%;height:52%;transform:translateX(-50%);background:linear-gradient(90deg,#090c16,#26202b,#080b13);clip-path:polygon(50% 0,75% 14%,75% 26%,92% 26%,92% 100%,8% 100%,8% 26%,25% 26%,25% 14%);opacity:.88}.tower:after{content:"";position:absolute;left:45%;top:35%;width:10%;height:22%;background:#e3814b;box-shadow:0 0 35px 15px #e15a2a88}.veil{position:fixed;inset:0;background:linear-gradient(180deg,#080b1488,transparent 25%,#080b1455 54%,#080b14 90%);pointer-events:none}.app{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:calc(30px + env(safe-area-inset-top)) 22px calc(35px + env(safe-area-inset-bottom));text-align:center}.logo{margin:auto 0 20px;padding-top:10vh;text-shadow:0 3px 22px #000;letter-spacing:.16em;font-size:clamp(24px,8vw,43px);line-height:1.22;font-weight:normal;text-transform:uppercase}.logo small{display:block;color:#d5a779;font-size:10px;letter-spacing:.45em;margin-bottom:14px}.menu{width:min(100%,410px);display:grid;gap:11px}.btn{font-family:inherit;font-size:15px;letter-spacing:.08em;color:#f7e8d7;background:linear-gradient(90deg,#191b2bcc,#29212bcc);border:1px solid #a17b6480;padding:16px 14px;border-radius:3px;min-height:52px;cursor:pointer;touch-action:manipulation}.btn:active{background:#744b40}.btn:disabled{opacity:.35}.minor{font-size:10px;color:#c9b8a7;letter-spacing:.18em;margin-top:15px}.panel{display:none;position:fixed;z-index:5;inset:0;background:linear-gradient(160deg,#101a2af5,#100d17fa);padding:calc(24px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));overflow-y:auto;text-align:center}.panel.open{display:flex;flex-direction:column;align-items:center;justify-content:center}.panel h2{color:#e6c39a;font-size:25px;font-weight:normal;line-height:1.3}.panel p{line-height:1.75;font-size:16px;max-width:460px;color:#eee4db}.actions{width:min(100%,430px);display:grid;gap:12px;margin-top:22px}.actions .btn{width:100%}.quest{text-align:left;display:flex;flex-direction:column;gap:7px}.quest small{color:#d3c4b8;line-height:1.5;letter-spacing:0}.quest em{color:#e5b57e;font-size:12px}.quest.done{opacity:.55}textarea{width:100%;min-height:90px;background:#0c101d;color:white;border:1px solid #8e6a5a;padding:12px;font-size:16px;border-radius:2px}.label{text-align:left;color:#dbc1a7;font-size:13px;margin-top:10px}.meta{font-size:11px;color:#c9a77d;letter-spacing:.1em;margin:8px 0}</style></head><body>
<div class="world"><div class="tower"></div></div><div class="veil"></div><main class="app"><h1 class="logo"><small>Une chronique des terres oubliées</small>Les Cendres<br>du Royaume</h1><div class="menu"><button class="btn" id="new">Nouvelle partie</button><button class="btn" id="continue">Continuer</button><button class="btn" id="load">Charger une partie</button><button class="btn" id="options">Options</button></div><div class="minor">CHRONIQUES · VERSION WEB 0.5</div></main>
<section class="panel" id="panel" aria-live="polite"><h2 id="heading"></h2><p id="message"></p><div class="actions" id="actions"></div></section>
<script>
"use strict";
const KEY="royaume-menu-save-v2",OLD="royaume-menu-save-v1";
let game=null;
const scenes=[
{title:"Prologue — La dernière braise",text:"Au-delà des montagnes, un royaume sommeille. Ses portes sont encore debout, mais ses feux se sont éteints. Cette nuit, une lumière fragile apparaît au sommet de la vieille tour.",button:"Suivre la lumière"},
{title:"La voix dans les cendres",text:"« Tu cherches peut-être un grand destin. Pourtant, ce royaume n’a besoin que d’une première décision. » Devant toi, trois chemins s’ouvrent. Aucun ne demande d’être parfait.",button:"Approcher la porte"},
{title:"Le seuil",text:"Une porte de fer cède dans un long soupir. Derrière elle, un foyer froid, une table encombrée et une fenêtre ouverte sur le vent. Tu comprends : la première victoire sera modeste.",button:"Ouvrir le journal"}];
const quests=[{name:"Rallumer le foyer",desc:"Consacrer 10 minutes à remettre en ordre un espace de la maison.",xp:30},{name:"Retrouver le souffle",desc:"Bouger 15 minutes, à ton rythme.",xp:30},{name:"Tracer une route",desc:"Écrire une seule chose que tu aimerais améliorer dans ta vie.",xp:20}];
const el=id=>document.getElementById(id);
function read(k){try{return localStorage.getItem(k)}catch(e){return null}}
function write(){try{localStorage.setItem(KEY,JSON.stringify(game))}catch(e){}update()}
function update(){el("continue").disabled=!read(KEY)&&!read(OLD)}
function button(label,fn,cls=""){let b=document.createElement("button");b.className="btn "+cls;b.textContent=label;b.addEventListener("click",fn);return b}
function show(h,m){el("heading").textContent=h;el("message").textContent=m;el("actions").replaceChildren();el("panel").classList.add("open")}
function add(label,fn,cls){el("actions").append(button(label,fn,cls))}
function close(){el("panel").classList.remove("open")}
function newGame(){if(read(KEY)||read(OLD)){show("Nouvelle partie","Une sauvegarde existe déjà. Recommencer effacera la progression de cette démonstration.");add("Confirmer la nouvelle partie",start);add("Annuler",close)}else start()}
function start(){game={scene:0,chapter:1,xp:0,days:{},ideas:[],evenings:{},started:new Date().toISOString()};write();story()}
function resume(){let raw=read(KEY);try{game=raw?JSON.parse(raw):null}catch(e){game=null}if(!game&&read(OLD)){game={scene:0,chapter:1,xp:0,days:{},ideas:[],evenings:{},started:new Date().toISOString()};write()}if(!game){show("Aucune sauvegarde","Commence une nouvelle partie.");add("Retour au menu",close);return}game.scene>=scenes.length?journal():story()}
function story(){if(game.scene>=scenes.length){journal();return}let s=scenes[game.scene];show(s.title,s.text);add(s.button,()=>{game.scene++;write();story()})}
function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function done(){return game.days[today()]||[]}
function journal(){show("Le journal du voyageur",done().length===3?"Les trois premières braises brillent à nouveau. Le royaume se souviendra de cette journée.":"Les grandes victoires naissent parfois de gestes discrets. Choisis une quête, puis reviens quand tu l’auras accomplie.");let meta=document.createElement("div");meta.className="meta";meta.textContent="CHAPITRE I · LE RÉVEIL / "+game.xp+" XP";el("actions").append(meta);quests.forEach((q,i)=>{let b=button((done().includes(i)?"✦ ":"◇ ")+q.name,()=>quest(i),"quest"+(done().includes(i)?" done":""));let d=document.createElement("small");d.textContent=q.desc;let x=document.createElement("em");x.textContent=done().includes(i)?"Accomplie":"+"+q.xp+" XP";b.append(d,x);el("actions").append(b)});add("Grimoire des pensées",grimoire);add("La veillée du soir",evening);add("Retour au menu",close)}
function quest(i){if(done().includes(i)){journal();return}show(quests[i].name,quests[i].desc);add("J’ai accompli cette quête",()=>{let d=today();game.days[d]??=[];if(!game.days[d].includes(i)){game.days[d].push(i);game.xp+=quests[i].xp;write()}show("Quête accomplie","Une braise s’illumine. +"+quests[i].xp+" XP.");add("Revenir au journal",journal)});add("Pas encore",journal)}
function grimoire(){show("Le grimoire","Dépose ici une pensée, une ambition ou une préoccupation.");let t=document.createElement("textarea");t.placeholder="Ce qui me traverse l’esprit…";el("actions").append(t);add("Inscrire au grimoire",()=>{if(t.value.trim()){game.ideas.push({date:new Date().toISOString(),text:t.value.trim()});write()}grimoire()});add("Revenir au journal",journal);let m=document.createElement("div");m.className="meta";m.textContent=game.ideas.length+" pensée(s) conservée(s)";el("actions").append(m)}
function evening(){show("La veillée","Avant que la nuit ne tombe, le chroniqueur t’écoute.");let saved=game.evenings[today()]||["","",""];let fields=[];["Qu’as-tu accompli aujourd’hui ?","Qu’est-ce qui t’a pesé ?","Comment te sens-tu ?"].forEach((q,i)=>{let l=document.createElement("label");l.className="label";l.textContent=q;let t=document.createElement("textarea");t.value=saved[i]||"";el("actions").append(l,t);fields.push(t)});add("Confier cette journée",()=>{game.evenings[today()]=fields.map(x=>x.value);write();show("La nuit peut venir","Tes paroles ont été conservées dans le journal.");add("Revenir au journal",journal)});add("Revenir au journal",journal)}
el("new").addEventListener("click",newGame);el("continue").addEventListener("click",resume);el("load").addEventListener("click",resume);el("options").addEventListener("click",()=>{show("Options","Cette version sauvegarde automatiquement sur cet appareil et dans ce navigateur.");add("Retour au menu",close)});update();
</script></body></html>
